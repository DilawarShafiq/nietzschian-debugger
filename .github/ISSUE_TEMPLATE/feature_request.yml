name: Feature idea
description: Suggest a new command, lens, flag, or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One rule shapes every feature here: **the tool asks questions; it never hands over the fix.**
        Ideas that sharpen that are the most welcome.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. A sample session or command line helps a lot.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, I'd like to open a PR"
        - "Maybe, with some guidance"
        - "No, just suggesting"
    validations:
      required: true
