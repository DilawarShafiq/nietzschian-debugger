name: Clinician demo on GitHub Pages (fork only)

on:
  workflow_dispatch:
  push:
    branches: [main, feature/psychology-reflection]
    paths:
      - "web/**"
      - ".github/workflows/clinician-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: clinician-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'bartvanderwal/nietzschian-diagnoser'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test
        working-directory: web
        env:
          BASE_PATH: /nietzschian-diagnoser/
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/client
      - name: Deploy frontend
        id: deployment
        uses: actions/deploy-pages@v4
